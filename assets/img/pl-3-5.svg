<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Трёхслойный и пятислойный гофрокартон в разрезе"><title>Трёхслойный и пятислойный гофрокартон в разрезе</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C26"/><stop offset="1" stop-color="#0B1118"/></linearGradient><radialGradient id="glow" cx="0.82" cy="0.1" r="0.7"><stop offset="0" stop-color="#E07B26" stop-opacity=".22"/><stop offset="1" stop-color="#E07B26" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0.06" cy="1" r="0.7"><stop offset="0" stop-color="#2E8AD6" stop-opacity=".20"/><stop offset="1" stop-color="#2E8AD6" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="750" fill="url(#glow)"/><rect width="1200" height="750" fill="url(#glow2)"/><text x="70" y="92" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#F3EFE9" text-anchor="start">Три слоя и пять слоёв</text><text x="70" y="128" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Пятислойный лист — это тот же «сэндвич», собранный дважды</text><rect x="70" y="40" width="52" height="4" rx="2" fill="#E07B26"/><rect x="90" y="230" width="470" height="330" rx="18" fill="#ffffff" opacity=".04" stroke="#26333F"/><text x="120" y="290" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#F49B3F" text-anchor="start">3 слоя</text><text x="120" y="322" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#9FB0BF" text-anchor="start">лайнер + волна + лайнер</text><rect x="120" y="380" width="410" height="16" rx="3" fill="#D9A968"/><rect x="120" y="392" width="410" height="4" rx="2" fill="#B9803F" opacity=".55"/><path d="M120 440 C140.5 440 158.1 398 178.6 398 C199.1 398 2