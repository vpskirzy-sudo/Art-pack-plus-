<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Строение гофрокартона: лайнер, флютинг, лайнер"><title>Строение гофрокартона: лайнер, флютинг, лайнер</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C26"/><stop offset="1" stop-color="#0B1118"/></linearGradient><radialGradient id="glow" cx="0.82" cy="0.1" r="0.7"><stop offset="0" stop-color="#E07B26" stop-opacity=".22"/><stop offset="1" stop-color="#E07B26" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0.06" cy="1" r="0.7"><stop offset="0" stop-color="#2E8AD6" stop-opacity=".20"/><stop offset="1" stop-color="#2E8AD6" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="750" fill="url(#glow)"/><rect width="1200" height="750" fill="url(#glow2)"/><text x="70" y="92" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#F3EFE9" text-anchor="start">Из чего состоит гофрокартон</text><text x="70" y="128" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Трёхслойный лист: две плоские стенки и волна между ними</text><rect x="70" y="40" width="52" height="4" rx="2" fill="#E07B26"/><rect x="326" y="238" width="588" height="152" rx="18" fill="#ffffff" opacity=".04" stroke="#26333F"/><rect x="360" y="270" width="520" height="16" rx="3" fill="#D9A968"/><rect x="360" y="282" width="520" height="4" rx="2" fill="#B9803F" opacity=".55"/><path d="M360 330 C380.2 330 397.6 288 417.8 288 C438.0 288 455.3 330 475.6 330 C495.8 330 513.1 288 533.3 288 C553.6 288 570.9 330 591.1 330 C611.3 330 628.7 288 648.9 288 C669.1 288 686.4 330 706.7 330 C726.9 330 744.2 288 764.4 288 C784.7 288 802.0 330 822.2 330 C842.4 330 859.8 288 880.0 288" fill="none" stroke="#C89355" stroke-width="7" stroke-linecap="round"/><rect x="360" y="332" width="520" height="16" rx="3" fill="#D9A968"/><rect x="360" y="344" width="520" height="4" rx="2" fill="#B9803F" opacity=".55"/><path d="M430 278 L320 200" stroke="#F49B3F" stroke-width="2" opacity=".8"/><circle cx="430" cy="278" r="4.5" fill="#F49B3F"/><text x="310" y="206" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#F3EFE9" text-anchor="end">Лайнер</text><path d="M430 310 L320 334" stroke="#F49B3F" stroke-width="2" opacity=".8"/><circle cx="430" cy="310" r="4.5" fill="#F49B3F"/><text x="310" y="340" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#F3EFE9" text-anchor="end">Флютинг (волна)</text><path d="M430 340 L320 468" stroke="#F49B3F" stroke-width="2" opacity=".8"/><circle cx="430" cy="340" r="4.5" fill="#F49B3F"/><text x="310" y="474" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#F3EFE9" text-anchor="end">Лайнер</text><text x="924" y="206" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Плоские слои держат</text><text x="924" y="232" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">нагрузку и печать</text><text x="924" y="340" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Волна даёт жёсткость</text><text x="924" y="366" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">и гасит удар</text><rect x="70" y="612" width="1060" height="84" rx="14" fill="#E07B26" opacity=".10" stroke="#E07B26" stroke-opacity=".35"/><text x="100" y="647" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#F3EFE9" text-anchor="start">Т — трёхслойный, П — пятислойный.</text><text x="100" y="677" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#F3EFE9" text-anchor="start">Первая цифра — число плоских слоёв, вторая — прочность сырья.</text></svg>