<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Гофроящик с клапанами и открытый гофролоток"><title>Гофроящик с клапанами и открытый гофролоток</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C26"/><stop offset="1" stop-color="#0B1118"/></linearGradient><radialGradient id="glow" cx="0.82" cy="0.1" r="0.7"><stop offset="0" stop-color="#E07B26" stop-opacity=".22"/><stop offset="1" stop-color="#E07B26" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="0.06" cy="1" r="0.7"><stop offset="0" stop-color="#2E8AD6" stop-opacity=".20"/><stop offset="1" stop-color="#2E8AD6" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="750" fill="url(#glow)"/><rect width="1200" height="750" fill="url(#glow2)"/><text x="70" y="92" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#F3EFE9" text-anchor="start">Ящик и лоток</text><text x="70" y="128" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Закрытый короб для перевозки — и открытая тара для выкладки</text><rect x="70" y="40" width="52" height="4" rx="2" fill="#E07B26"/><text x="150" y="250" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#F49B3F" text-anchor="start">Гофроящик</text><path d="M220 365 H520 L556 287 H256 Z" fill="#C89355" opacity=".9"/><path d="M150 400 h300 v160 h-300 z" fill="#D9A968"/><path d="M450 400 l70 -35 v160 l-70 35 z" fill="#B9803F"/><path d="M150 400 l70 -35 h300 l-70 35 z" fill="#C89355"/><path d="M150 400 H450 L414 318 H114 Z" fill="#B9803F" opacity=".92"/><text x="150" y="612" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Четыре клапана сверху и снизу — короб закрывается,</text><text x="150" y="638" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">штабелируется и едет закрытым</text><text x="700" y="250" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#F49B3F" text-anchor="start">Гофролоток</text><path d="M700 490 h300 v70 h-300 z" fill="#D9A968"/><path d="M1000 490 l70 -35 v70 l-70 35 z" fill="#B9803F"/><path d="M700 490 l70 -35 h300 l-70 35 z" fill="#C89355"/><path d="M700 490 l70 -35 h300 l-70 35 z" fill="#0B1118" opacity=".9"/><path d="M700 490 l70 -35 h300" fill="none" stroke="#D9A968" stroke-width="4"/><text x="700" y="612" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">Открытый верх и низкие борта — товар видно,</text><text x="700" y="638" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#9FB0BF" text-anchor="start">его легко достать и выложить на полку</text><path d="M600 240 V648" stroke="#26333F" stroke-width="2" opacity=".7"/></svg>