<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Сравнение: закрытый гофроящик и открытый гофролоток"><title>Сравнение: закрытый гофроящик и открытый гофролоток</title><rect width="1000" height="470" rx="22" fill="#F7F3ED"/><text x="40" y="58" font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#0B1118" text-anchor="start">Гофроящик и гофролоток</text><rect x="40" y="88" width="440" height="350" rx="18" fill="#fff" stroke="#E4D8C6" stroke-width="2"/><polygon points="165.0,241.3 280.5,308.0 280.5,217.7 165.0,151.0" fill="#D49A5C" stroke="#8C4A0E" stroke-width="2" stroke-linejoin="round" /><polygon points="355.0,265.0 280.5,308.0 280.5,217.7 355.0,174.7" fill="#B8773C" stroke="#8C4A0E" stroke-width="2" stroke-linejoin="round" /><polygon points="239.5,108.0 355.0,174.7 280.5,217.7 165.0,151.0" fill="#E6BC86" stroke="#8C4A0E" stroke-width="2" stroke-linejoin="round" /><path d="M202.3,129.5 L317.7,196.2" stroke="#8C4A0E" stroke-width="2.5"/><polygon points="206.7,126.9 322.2,193.6 313.3,198.8 197.8,132.1" fill="#EFD2A8" stroke="none" stroke-width="0" stroke-linejoin="round" opacity=".9"/><text x="68" y="350" font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#8C4A0E" text-anchor="start">Гофроящик</text><text x="68" y="376" font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#4A5563" text-anchor="start">закрыт со всех сторон,</text><text x="68" y="398" font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#4A5563" text-anchor="start">клапаны сверху и снизу —</text><text x="68" y="420" font-family="Manrope, Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#4A5563" text-anchor="start">для перевозки и склада</text><rect x="520" y="88" width="440" height="350" rx="18" fill="#fff" stroke="#E4D8C6" stroke